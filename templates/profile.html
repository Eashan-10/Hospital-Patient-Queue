{% extends "base.html" %}
{% block title %}Patient {{ pid }} · Ward Queue{% endblock %}
{% block content %}
<a class="back" href="/#queue">Back to queue</a>
<div id="profile" data-id="{{ pid }}"><p class="muted">Loading patient…</p></div>
<dialog id="editdlg"><form id="editform">
  <h2>Edit patient</h2>
  {% set p = 'e' %}{% include "_fields.html" %}
  <div class="actions"><button type="button" id="e-cancel">Cancel</button><button class="primary">Save changes</button></div>
</form></dialog>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='profile.js') }}"></script>{% endblock %}
