<label>Full name<input id="{{p}}-name" required maxlength="80" autocomplete="off"></label>
<div class="row">
  <label>Age<input id="{{p}}-age" type="number" min="0" max="130" required></label>
  <label>Gender<select id="{{p}}-gender"><option>Female</option><option>Male</option><option>Other</option></select></label>
</div>
<fieldset class="urg"><legend>Urgency</legend>
{% for v, l in [(1,'Minor'),(2,'Low'),(3,'Moderate'),(4,'High'),(5,'Critical')] %}
<label class="chip u{{v}}"><input type="radio" name="{{p}}-urg" value="{{v}}" {% if v==3 %}checked{% endif %}><span><b>{{v}}</b>{{l}}</span></label>
{% endfor %}</fieldset>
<label>Notes <span class="muted">(optional)</span><textarea id="{{p}}-notes" rows="3" maxlength="500"></textarea></label>
